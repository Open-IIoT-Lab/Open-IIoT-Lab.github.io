email: "hello@openiiotlab.org"
github: Open-IIoT-Lab

short_bio_text_justify: false
short_bio: >-
  <p>
    Open IIoT Lab works on the unglamorous middle of industrial digitalisation: the place where
    machines, models, protocols, and people have to agree well enough to run a plant. We build
    <strong>edge-native systems</strong>, practical <strong>interoperability</strong> layers, and
    automation that can be inspected, tested, and argued with.
  </p>
  <p>
    Everything the lab produces is published in the open — reference implementations, benchmarks,
    field notes, and the failure modes that taught us something. We would rather ship a small system
    that a plant engineer can read end to end than a large one nobody can question.
  </p>

