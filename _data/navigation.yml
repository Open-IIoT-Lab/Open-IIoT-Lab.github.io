pages:
# NOTE: `name` field must match the `navbar_title` field in the page's front matter to ensure the correct page is highlighted in the navbar.
#       For example, the `navbar_title` field in `research.html` is "Research" and the `name` field here should also be "Research"
#
# URLs carry a trailing slash because pages are generated as directory indexes
# (/publications/index.html). Linking to the canonical form avoids the redirect a host
# would otherwise add, keeps in-page fragments intact, and works on any static server.
- name: Home
  url: /
- name: Research
  url: /research/
- name: Publications
  url: /publications/
- name: People
  url: /people/
- name: Blog
  url: /blog/
- name: Gallery
  url: /gallery/
- name: Contact
  url: /contact/
