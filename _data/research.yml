- id: networks
  title: Networks that keep their promises
  short_title: Deterministic networks
  question: Can a network deliver on time when traffic, scale and link quality keep changing?
  summary: Scheduling, reliability and monitoring for time-sensitive industrial networks.
  introduction: >-
    Industrial applications need data at the right time, even when resources are shared
    and links are imperfect. We study how to plan and adapt communication across devices,
    switches and wireless links, with timing and reliability treated as coupled requirements.
  threads:
    - title: Move beyond a single central schedule
      description: >-
        MSS studies how to place flows in cyclic queues. Dependency-aware scheduling
        captures interactions among flows, while DiRTS distributes scheduling decisions
        to make them more responsive to local conditions.
      papers:
        - {key: '9893358', label: MSS}
        - {key: guo2024, label: Dependency-aware scheduling}
        - {key: '10.1145/3676848', label: DiRTS}
    - title: Adapt the plan to uncertainty
      description: >-
        TSN–Wi-Fi scheduling brings wireless reliability into the allocation of time,
        space and frequency. DARS connects routing and scheduling with changing
        reliability, extending the question from a feasible plan to fault-tolerant service.
      papers:
        - {key: '10401973', label: Deterministic network architecture}
        - {key: '10.1145/3716550.3722018', label: TSN–Wi-Fi}
        - {key: Tian_2026_DARS, label: DARS}
    - title: Observe the network at manageable cost
      description: >-
        Adaptation requires visibility. HiMon uses hierarchical sketching to balance
        measurement accuracy with the memory and processing cost of network monitoring.
      papers:
        - {key: HiMon_2026, label: HiMon}
  resources: [mss, tsn-datasets, himon]
  paper_keys:
    - '9629333'
    - '9976177'
    - '9893358'
    - '10183779'
    - '10335763'
