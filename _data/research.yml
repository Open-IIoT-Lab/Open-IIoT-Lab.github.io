- id: wireless
  title: Open and trustworthy wireless
  short_title: Wireless systems
  question: How can we see, control and trust what happens inside a low-power radio network?
  summary: Open radio platforms, resilient timing and efficient spectrum access.
  introduction: >-
    A received packet reveals only part of the story. Timing, frequency and channel activity
    carry information about both network operation and failure. We expose those signals,
    build mechanisms around them, and make the physical layer available for experimentation.
  threads:
    - title: Make hidden radio behavior observable
      description: >-
        LoRaCP separates control traffic from the data network. LoRaTS uses radio observations
        to examine the trustworthiness of timestamps. Our Sim2Real work extends this line
        to calibration across individual radio devices.
      papers:
        - {key: gu2019one, label: LoRaCP}
        - {key: '10.1145/3474368', label: LoRaTS}
        - {key: Gu_2026_Sim2RealCalibration, label: Sim2Real calibration}
    - title: Open the physical layer
      description: >-
        SoftNB develops from a working NB-IoT prototype into a portable SDR implementation
        and a tutorial on synchronization, demodulation and validation. The code gives
        researchers a platform on which to inspect and change the receiver.
      papers:
        - {key: Zheng2024, label: SoftNB prototype}
        - {key: '10.1109/ton.2026.3665549', label: SoftNB system}
        - {key: Zheng_2026, label: NB-IoT PHY tutorial}
    - title: Rethink how radios share spectrum
      description: >-
        LMAC examines carrier sensing for LoRa. LoPhy and nonlinear chirp research explore
        how waveform structure changes what a channel can carry and how reliably it can be decoded.
      papers:
        - {key: '10.1145/3564530', label: LMAC}
        - {key: lophy_journal, label: LoPhy}
        - {key: Shi_2026_NonlinearCSS, label: Nonlinear CSS}
  resources: [softnb, lmac]
  paper_keys:
    - gu2017one
    - gu2019one
    - gamage2020lmac
    - '10.1145/3564530'
