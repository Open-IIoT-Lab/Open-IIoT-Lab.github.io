- id: intelligence
  title: Industrial Intelligence
  short_title: Industrial Intelligence
  question: How can heterogeneous observations become useful decisions on real machines?
  summary: Information models, transferable perception and resource-aware learning for industrial systems.
  introduction: Data becomes useful when a system can interpret it, learn from it and act within practical constraints.
    We connect industrial information modeling with sensing and learning, then study how to place computation and
    schedule decisions across devices, factories and the cloud.
  threads:
  - title: Give industrial data a shared meaning
    description: Work on interoperable industrial architectures and Asset Administration Shells connects heterogeneous
      equipment. Text2UA carries this effort into language-model-assisted engineering, translating textual descriptions
      into structured OPC UA information models.
    papers:
    - key: WANG2022102631
      label: Interoperable IIoT
    - key: '9976146'
      label: AAS production platform
    - key: '10965923'
      label: Text2UA
  - title: Learn perception that transfers
    description: Useful sensing models should cope with scarce labels and changing devices or environments. MESEN
      learns across sensing modalities, DecoupledHAR transfers across sensor datasets, and RoboSign uses a robotic
      arm-hand system to generate radar training data from video.
    papers:
    - key: MSESN
      label: MESEN
    - key: Tang_2026_DecoupledAxes
      label: DecoupledHAR
    - key: Tang_2026_RobotSLR
      label: RoboSign
  - title: Turn models into executable decisions
    description: Learning and optimization must respect latency, energy and hardware limits. We study production
      scheduling, multi-model inference on heterogeneous processors and coordinated computation across the device-edge-cloud
      continuum. Privacy-aware inference adds a further constraint on what devices should reveal.
    papers:
    - key: '10734312'
      label: Job shop scheduling
    - key: Shen_2025
      label: Hetero2Pipe
    - key: Long_2026
      label: End-edge-cloud coordination
    - key: xu2020lightweight
      label: ObfNet
