    - '10.1109/hpcc64274.2024.00120'

- id: sensing
  title: Sensing with less energy
  short_title: Sensing and perception
  question: What can the physical world tell us through signals that are already there?
  summary: Localization, backscatter and perception from radio, acoustic and magnetic signals.
  introduction: >-
    Wireless signals interact with motion, objects and the human body. We study how to turn
    those interactions into useful measurements while limiting the cost in energy, hardware
    and labeled data. The work connects physical models, working sensing systems and learning.
  threads:
    - title: Locate and track through communication signals
      description: >-
        Our LoRa localization work moves from understanding the opportunities and limits
        to robot tracking with LTrack and indoor localization using standard LoRaWAN
        uplinks with ILLOC.
      papers:
        - {key: gu2018lora, label: Localization foundations}
        - {key: '9684677', label: LTrack}
        - {key: '10.1145/3517245', label: ILLOC}
    - title: Let the environment modulate the radio
      description: >-
        Backscatter links reuse incident radio energy. Collaborative work on Mighty,
        Twaltz and WindScatter explores longer links, communication across frequency
        bands and wind measurements encoded in the reflected signal.
      papers:
        - {key: '10742296', label: Mighty}
        - {key: '11045842', label: Twaltz}
        - {key: '10.1109/tmc.2026.3650936', label: WindScatter}
    - title: Bridge physical signals and human activity
      description: >-
        Biomagnetic and mmWave sensing reveal physiological and behavioral information.
        MESEN and DecoupledHAR address a complementary challenge: making learned
        representations useful when sensing modalities, labels or datasets change.
      papers:
        - {key: guo2024magwear, label: Biomagnetism}
        - {key: MSESN, label: MESEN}
        - {key: Tang_2026_DecoupledAxes, label: DecoupledHAR}
  resources: [decoupledhar, mesen]
