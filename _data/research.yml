    - Tian_2026_DARS
    - Zhou_2024

- id: intelligence
  title: Intelligence across industrial systems
  short_title: Industrial intelligence
  question: How can heterogeneous data become useful decisions on real industrial systems?
  summary: Interoperable information models, learning and computation from devices to the cloud.
  introduction: >-
    Useful industrial intelligence must cross boundaries between equipment, data formats
    and computing resources. We connect information modeling with learning and scheduling
    so that applications can interpret data and make decisions under practical constraints.
  threads:
    - title: Give machines a shared description
      description: >-
        Work on flat industrial IoT architectures and Asset Administration Shells studies
        how heterogeneous equipment can be represented and connected. Text2UA extends
        this effort by turning textual descriptions into OPC UA information models.
      papers:
        - {key: WANG2022102631, label: Interoperable IIoT architecture}
        - {key: '9976146', label: AAS production platform}
        - {key: '10965923', label: Text2UA}
    - title: Bring decisions within resource budgets
      description: >-
        Production scheduling, distributed inference and computation offloading all
        couple application goals to limited resources. Our work studies these decisions
        from the factory job shop to heterogeneous processors and end–edge–cloud systems.
      papers:
        - {key: '10734312', label: Flexible job shop scheduling}
        - {key: Shen_2025, label: Hetero2Pipe}
        - {key: Long_2026, label: End–edge–cloud coordination}
    - title: Learn under changing data and privacy constraints
      description: >-
        ObfNet studies what devices should reveal for remote inference. MESEN and
        DecoupledHAR explore how sensing models can learn from complementary data
        and transfer across deployment conditions.
      papers:
        - {key: xu2020lightweight, label: ObfNet}
        - {key: MSESN, label: MESEN}
        - {key: Tang_2026_DecoupledAxes, label: DecoupledHAR}
