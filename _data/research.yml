- id: networks
  title: Industrial Networks
  short_title: Industrial Networks
  question: How can connected machines exchange the right information, at the right time, with limited resources?
  summary: Open wireless platforms, efficient sensing and dependable communication for connected machines.
  introduction: Industrial networks must do more than move packets. They need to expose physical events, share scarce
    radio and computing resources, and maintain timely service as conditions change. We study these requirements
    from the radio waveform to the network schedule.
  threads:
  - title: Open the radio, expand what it can carry
    description: SoftNB makes NB-IoT physical-layer processing available for experimentation. LoPhy embeds an additional
      information channel within LoRa waveforms; LoRaCP and LMAC explore how control and channel access can make
      low-power networks more manageable.
    papers:
    - key: 10.1109/ton.2026.3665549
      label: SoftNB
    - key: lophy_journal
      label: LoPhy
    - key: gu2017one
      label: LoRaCP
    - key: gamage2020lmac
      label: LMAC
  - title: Make timely delivery a system property
    description: MSS turns flow features and resource availability into a scheduling score. DiRTS distributes scheduling
      decisions, while TSN-Wi-Fi and DARS address wireless uncertainty and failures. Together these studies connect
      efficient planning with reliable service.
    papers:
    - key: '9893358'
      label: MSS
    - key: 10.1145/3676848
      label: DiRTS
    - key: 10.1145/3716550.3722018
      label: TSN-Wi-Fi
    - key: Tian_2026_DARS
      label: DARS
  - title: Extract more from physical signals
    description: Backscatter and passive wireless systems use interactions with the environment to communicate and
      sense at low energy cost. Twaltz studies communication across frequency bands, while collaborative work on
      Mighty and WindScatter explores long-range links and environmental measurements.
    papers:
    - key: '11045842'
      label: Twaltz
    - key: '10742296'
      label: Mighty
    - key: 10.1109/tmc.2026.3650936
      label: WindScatter
  - title: Measure before adapting
    description: Reliable adaptation depends on what a network can observe. LoRaTS studies trustworthy timing from
      radio observations; Sim2Real calibrates device-specific frequency offsets; HiMon aggregates traffic measurements
      with bounded resource cost.
    papers:
    - key: 10.1145/3474368
      label: LoRaTS
    - key: Gu_2026_Sim2RealCalibration
      label: Sim2Real calibration
    - key: HiMon_2026
      label: HiMon
