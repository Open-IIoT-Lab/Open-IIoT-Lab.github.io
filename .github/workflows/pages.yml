name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish before the next one starts, but do not cancel a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Record which build this is
        run: |
          printf 'commit: "%s"\nbuilt: "%s"\n' "${GITHUB_SHA:0:7}" "$(date -u '+%Y-%m-%d %H:%M UTC')" > _data/build.yml
          cat _data/build.yml

      - name: Build the site with Jekyll
        run: bundle exec jekyll build --trace

      - name: List the generated pages
        run: |
          echo "Pages and files generated by Jekyll:"
          find _site -type f | sort

      - name: Check that every page was generated
        run: |
          missing=0
          # The site's permalink style gives pages clean URLs, so look for either
          # publications.html or publications/index.html and so on.
          for page in index research publications resources people blog gallery contact; do
            if [ ! -f "_site/$page.html" ] && [ ! -f "_site/$page/index.html" ]; then
              echo "::error::Jekyll did not generate a page for $page"
              missing=1
            fi
          done
          [ -f "_site/404.html" ] || { echo "::error::Jekyll did not generate _site/404.html"; missing=1; }
          post_count=$(find _site/blog -name 'index.html' -mindepth 2 2>/dev/null | wc -l)
          echo "Blog articles generated: $post_count"
          [ "$post_count" -gt 0 ] || { echo "::error::no blog articles were generated"; missing=1; }
          exit $missing

      - name: Check that no internal link is broken
        run: python3 scripts/check_links.py _site

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Keep a copy of the built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    needs: build
    # Pull requests build the site to prove it compiles, but never publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
