# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.

# Site settings
title: Open Industrial IoT Lab
description: >-
  Research in industrial networks and industrial intelligence at Zhejiang University,
  led by Chaojie Gu.

# The repository is named Open-IIoT-Lab.github.io, so GitHub Pages serves it as
# the organization homepage at https://open-iiot-lab.github.io/ — from the root
# of that domain, which is why baseurl stays empty. A local preview is also
# served from the root (http://127.0.0.1:4000/). If the site ever moves to a
# project path such as https://example.github.io/lab/, set baseurl to "/lab".
baseurl: ""
url: "https://open-iiot-lab.github.io"

# Build settings
markdown: kramdown

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - node_modules
  - .bundle
plugins:
  - jekyll-email-protect

# timezone: Asia/Shanghai

collections:
  - publications
